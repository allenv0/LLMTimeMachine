# Decade spine v0: 2015→2026 with visible holes + labeled substitutes + status-quo endpoint.
# Protocol local-v1 for runs; slot_status / timeline_holes from local-v3-longitudinal.
# NEVER rename a substitute into a frontier claim. Holes stay holes.
schema_version: "1"
cohort_id: decade-v0
protocol_version: local-v1
prompt:
  max_chars: 900
  language_note: "English supported path; non-English warned but permitted"
generation_profile_id: local-v1
generation_profiles:
  local-v1:
    id: local-v1
    max_new_tokens: 320
    temperature: 0.7
    top_p: 0.95
    seed: 20260923
    retries: 0
    tools_enabled: false
    network_enabled: false

# Visible empty years. UI renders dashed nodes with these reasons — never fake models.
timeline_holes:
  - display_year: 2015
    target_class: "char-RNN / NanoGPT-class"
    reason: "No pinned public 2015 checkpoint on this host. Retraining is out of local-v0 scope."
  - display_year: 2016
    target_class: "LM1B / n-gram era"
    reason: "Labeled hole. KenLM/n-gram demos would not be LLMs — omitted rather than misrepresented."
  - display_year: 2018
    target_class: "GPT-1 117M"
    reason: "GPT-1 weights not staged under a verified pin on this host."
  - display_year: 2020
    target_class: "GPT-3-class"
    reason: "GPT-3 is not locally deployable. OpenAI archive snapshots are not available offline."
  - display_year: 2025
    target_class: "GLM-4.7 / GPT-5.2 / Kimi-class"
    reason: "No verified 2025 open-weight pin staged on this 16GB host."
  - display_year: 2026
    target_class: "Astra / Fable / GLM-5.3-class"
    reason: "Late-2026 frontier is not a local checkpoint. Status-quo endpoint covers 'today' instead."

# Labeled endpoint for today — strongest local stand-in, not a fake year.
status_quo:
  model_id: qwen25-7b-instruct-2024
  display_name: "Status quo (today)"
  note: >-
    Strongest local checkpoint on this host (Qwen2.5 7B Q4). It is not a verified
    2026 frontier model. Labeled status-quo, not a calendar year.

# Optional quarantined FUTURE best-of-n. Off by default (WS6).
future:
  enabled: false
  display_name: "FUTURE (synthetic)"
  method: best-of-n-seeds
  member_model_ids:
    - mistral-7b-instruct-2023
    - qwen25-7b-instruct-2024
  selection_rule: >-
    Best-of-n across member models and n_seeds, ranked by local-v2-eval judge under
    judge-rubric-v2; ties broken by lower mean generation seconds then model id ascending.
    Never a historical year. Cannot mark first-solved unless user opts in.
  n_seeds: 3
  quarantine_note: >-
    Synthetic extrapolation (best-of-n). Not a historical year. Quarantined in the UI.

models:
  - id: gpt2-2019
    display_year: 2019
    display_name: GPT-2
    release_date: "2019-02-14"
    mode: base_continuation
    slot_status: available
    stands_for: ""
    source:
      repository: openai-community/gpt2
      revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
      artifact_filename: model.safetensors
      sha256: record-at-preload
    license_url: https://huggingface.co/openai-community/gpt2
    backend: transformers
    precision: fp32
    adapter_id: continuation-v1
    adapter_version: "1"
    input_limit_chars: 900
    generation_profile_id: local-v1
    limitations:
      - Small GPT-2, not GPT-2 XL / 1.5B (disk/RAM constrained host).
      - Base language model with no instruction tuning.
      - Often continues or wanders instead of answering.
    hardware_profile: lite

  - id: gpt2-medium-2021
    display_year: 2021
    display_name: GPT-2 Medium
    release_date: "2019-02-14"
    mode: base_continuation
