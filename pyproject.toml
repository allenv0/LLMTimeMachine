[project]
name = "llm-time-machine"
version = "0.1.0"
description = "Local, auditable LLM historical cohort demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "streamlit>=1.36,<2",
]

[project.optional-dependencies]
inference = [
    "torch>=2.2",
    "transformers>=4.44,<5",
    "accelerate>=0.33",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]
quantized = [
    "llama-cpp-python>=0.2.90",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
time-machine = "time_machine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/time_machine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
